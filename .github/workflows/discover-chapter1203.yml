name: Discover Chapter 1203 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1203.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1203 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify references and compile audit tools
        run: |
          python -m py_compile tools/audit_quest_prerequisite_drift.py tools/filter_quest_prerequisite_consensus.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for main_id in (2008, 2009):
              a = Path("ref3700/BinOutput/Quest") / f"{main_id}.json"
              b = Path("ref4000/BinOutput/Quest") / f"{main_id}.json"
              ah = hashlib.sha256(a.read_bytes()).hexdigest()
              bh = hashlib.sha256(b.read_bytes()).hexdigest()
              assert ah == bh, f"reference mismatch for {main_id}: {ah} != {bh}"
              print(f"reference-identical {main_id}.json {ah[:16]}")
          PY

      - name: Audit flattened Chapter 1203 graph
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 2008 --main 2009 \
            --include-reference-only \
            --only-differences \
            --json chapter1203-audit.json

          python tools/filter_quest_prerequisite_consensus.py \
            chapter1203-audit.json \
            --main 2008 --main 2009 \
            --consensus-count 2 \
            --json chapter1203-consensus.json

      - name: Audit source loss and emit complete manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}

          def meaningful(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [x for x in value if isinstance(x, dict) and x.get("type")]

          def normalized(row):
              out = []
              for entry in row.get("acceptCond") or []:
                  if not isinstance(entry, dict) or not entry.get("type"):
                      continue
                  params = entry.get("param") or []
                  if entry.get("type") in STATE_TYPES:
                      params = params[:2]
                  out.append({
                      "type": entry.get("type"),
                      "param": params,
                      "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
                  })
              return out

          total = match = missing = other = 0
          for main_id in (2008, 2009):
              cur = json.loads((Path("BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              ref = json.loads((Path("ref3700/BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              cur_by_id = {int(x["subId"]): x for x in cur.get("subQuests", [])}
              ref_by_id = {int(x["subId"]): x for x in ref.get("subQuests", [])}
              print(f"membership main={main_id} current={len(cur_by_id)} reference={len(ref_by_id)} current-only={sorted(set(cur_by_id)-set(ref_by_id))} ref-only={sorted(set(ref_by_id)-set(cur_by_id))}")
              for sid in sorted(set(cur_by_id) & set(ref_by_id)):
                  got = meaningful(cur_by_id[sid])
                  exp = meaningful(ref_by_id[sid])
                  total += 1
                  if got == exp:
                      match += 1
                  elif not got and exp:
                      missing += 1
                  else:
                      other += 1
                      print(f"source-other main={main_id} sub={sid} current={got!r} expected={exp!r}")
              for row in sorted(ref.get("subQuests", []), key=lambda x: int(x.get("subId") or 0)):
                  sid = int(row["subId"])
                  comb = row.get("acceptCondComb") or "LOGIC_AND"
                  accept = json.dumps(normalized(row), ensure_ascii=False, separators=(",", ":"))
                  print(f"manifest main={main_id} sub={sid} comb={comb} accept={accept}")
          print(f"source-summary-all total={total} match={match} missing={missing} other={other}")
          PY
