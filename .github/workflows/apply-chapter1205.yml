name: Validate and apply Chapter 1205 prerequisite restoration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-chapter1205.yml"

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cumulative prerequisite subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/400.json
            BinOutput/Quest/1000.json
            BinOutput/Quest/1002.json
            BinOutput/Quest/1003.json
            BinOutput/Quest/1008.json
            BinOutput/Quest/1009.json
            BinOutput/Quest/1010.json
            BinOutput/Quest/1011.json
            BinOutput/Quest/1012.json
            BinOutput/Quest/1013.json
            BinOutput/Quest/1014.json
            BinOutput/Quest/1015.json
            BinOutput/Quest/1016.json
            BinOutput/Quest/1018.json
            BinOutput/Quest/1020.json
            BinOutput/Quest/1021.json
            BinOutput/Quest/1022.json
            BinOutput/Quest/1023.json
            BinOutput/Quest/1024.json
            BinOutput/Quest/1025.json
            BinOutput/Quest/8000.json
            BinOutput/Quest/8001.json
            BinOutput/Quest/8002.json
            BinOutput/Quest/8003.json
            BinOutput/Quest/18000.json
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json
            BinOutput/Quest/2011.json
            BinOutput/Quest/2012.json
            BinOutput/Quest/2013.json
            BinOutput/Quest/2003.json
            BinOutput/Quest/2004.json
            BinOutput/Quest/2005.json
            BinOutput/Quest/2006.json
            BinOutput/Quest/2007.json
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json
            BinOutput/Quest/2010.json
            BinOutput/Quest/2014.json
            BinOutput/Quest/2015.json
            BinOutput/Quest/2016.json
            BinOutput/Quest/2017.json
            BinOutput/Quest/2018.json
            BinOutput/Quest/2019.json
            BinOutput/Quest/2020.json
            BinOutput/Quest/2021.json
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json
            ExcelBinOutput/QuestExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate manifest and current damage shape
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_inazuma_chapter1201.py \
            tools/fix_inazuma_chapter1202.py \
            tools/fix_inazuma_chapter1203.py \
            tools/fix_inazuma_chapter1204.py \
            tools/fix_liyue_chapter1205.py \
            tools/audit_quest_prerequisite_drift.py
          python - <<'PY'
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import fix_liyue_chapter1205 as entry
          import fix_liyue_prerequisites as base
          ids = [repair.sub_id for repair in base.REPAIRS]
          assert len(ids) == 590, f"expected 590 cumulative repair rows, got {len(ids)}"
          assert len(ids) == len(set(ids)), "duplicate subId in cumulative repair manifest"
          for main_id in (11009, 11013, 11014, 11015):
              a = Path("ref3700/BinOutput/Quest") / f"{main_id}.json"
              b = Path("ref4000/BinOutput/Quest") / f"{main_id}.json"
              assert hashlib.sha256(a.read_bytes()).digest() == hashlib.sha256(b.read_bytes()).digest(), main_id
          assert base.patch_sources(Path("BinOutput/Quest"), check=True) == 1
          assert base.patch_excel(Path("ExcelBinOutput/QuestExcelConfigData.json"), check=True) == 1
          print("validated Chapter 1205 historical consensus and current damage shape")
          PY

      - name: Apply and verify restoration
        run: |
          python tools/fix_liyue_chapter1205.py
          python tools/fix_liyue_chapter1205.py --check
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              "BinOutput/Quest/11009.json",
              "BinOutput/Quest/11013.json",
              "BinOutput/Quest/11014.json",
              "BinOutput/Quest/11015.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"expected exactly {sorted(allowed)}, got {sorted(changed)}")
          print("validated Chapter 1205 modified path allowlist")
          PY
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 11009 --main 11013 --main 11014 --main 11015 \
            --include-reference-only --only-differences --json chapter1205-after-repair.json
          python - <<'PY'
          import json
          report = json.load(open("chapter1205-after-repair.json", encoding="utf-8"))
          diffs = [row for row in report["rows"] if row["classification"] != "match"]
          if diffs:
              raise SystemExit(f"Chapter 1205 still has prerequisite differences: {diffs}")
          if report["counts"].get("match") != 81:
              raise SystemExit(f"expected 81 consensus matches, got {report['counts']}")
          if report["reference_disagreements"] or report["partial_reference_coverage"]:
              raise SystemExit(f"reference coverage is not clean: {report}")
          print("PASS: Chapter 1205 prerequisite graph = 81/81 historical consensus")
          PY

      - name: Commit repaired resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            BinOutput/Quest/11009.json \
            BinOutput/Quest/11013.json \
            BinOutput/Quest/11014.json \
            BinOutput/Quest/11015.json \
            ExcelBinOutput/QuestExcelConfigData.json
          git commit -m "fix: restore Chapter 1205 prerequisites [skip ci]"
          git push origin HEAD:main
