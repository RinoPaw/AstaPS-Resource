name: Validate Chapter 1105 prerequisite restoration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-chapter1105.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1105 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/18000.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/18000.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/18000.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile repair tools
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_liyue_chapter1102.py \
            tools/fix_liyue_chapter1103.py \
            tools/fix_liyue_chapter1105.py \
            tools/audit_quest_prerequisite_drift.py

      - name: Require exact current damage shape
        run: |
          set +e
          python tools/fix_liyue_chapter1105.py --check
          status=$?
          set -e
          test "$status" -eq 1

      - name: Simulate Chapter 1105 restoration
        run: |
          python tools/fix_liyue_chapter1105.py
          python tools/fix_liyue_chapter1105.py --check
          git diff --check

          python - <<'PY'
          import subprocess

          allowed = {
              "BinOutput/Quest/18000.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != allowed:
              raise SystemExit(f"expected exactly {sorted(allowed)}, got {sorted(changed)}")
          print("validated Chapter 1105 modified path allowlist")
          PY

      - name: Re-audit flattened graph against both references
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 18000 \
            --only-differences \
            --json chapter1105-after-simulated-repair.json

          python - <<'PY'
          import json
          report = json.load(open("chapter1105-after-simulated-repair.json", encoding="utf-8"))
          diffs = [row for row in report["rows"] if row["classification"] != "match"]
          if diffs:
              raise SystemExit(f"Chapter 1105 still has prerequisite differences: {diffs}")
          counts = report["counts"]
          if counts.get("match") != 29:
              raise SystemExit(f"expected 29 consensus matches, got {counts}")
          if report["reference_disagreements"] or report["partial_reference_coverage"]:
              raise SystemExit(f"reference coverage is not clean: {report}")
          print("PASS: Chapter 1105 flattened prerequisite graph = 29/29 historical consensus")
          PY
