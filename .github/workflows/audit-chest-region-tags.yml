name: One-time chest region tag audit
on:
  push:
    branches:
      - audit/chest-region-tags-71
    paths:
      - tools/audit_chest_region_tags.py
      - tools/audit_chest_lua_regions.py
      - .github/workflows/audit-chest-region-tags.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/Scene/1
            Scripts/Scene/3
            Scripts/Scene/4
            Scripts/Scene/5
            Scripts/Scene/6
            Scripts/Scene/7
            Scripts/Scene/9
            Scripts/Scene/10
            Scripts/Scene/11
            BinOutput/Scene/WorldArea/scene3_worldArea.json
            ExcelBinOutput/CityConfigData.json
            ExcelBinOutput/GadgetExcelConfigData.json
            tools/audit_chest_lua_regions.py
          sparse-checkout-cone-mode: false
      - name: Cross-check all open-world scene groups
        run: python tools/audit_chest_lua_regions.py
      - name: Save detailed audit CSV
        uses: actions/upload-artifact@v4
        with:
          name: chest-area-tag-audit-71
          path: audit-results/
          retention-days: 30
