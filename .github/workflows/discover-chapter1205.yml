name: Discover Chapter 1205 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1205.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1205 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json
            ExcelBinOutput/QuestExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/11009.json
            BinOutput/Quest/11013.json
            BinOutput/Quest/11014.json
            BinOutput/Quest/11015.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify references and audit flattened graph
        run: |
          python -m py_compile tools/audit_quest_prerequisite_drift.py tools/filter_quest_prerequisite_consensus.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          mains = (11009, 11013, 11014, 11015)
          for main_id in mains:
              a = Path("ref3700/BinOutput/Quest") / f"{main_id}.json"
              b = Path("ref4000/BinOutput/Quest") / f"{main_id}.json"
              ah = hashlib.sha256(a.read_bytes()).hexdigest()
              bh = hashlib.sha256(b.read_bytes()).hexdigest()
              assert ah == bh, f"reference mismatch for {main_id}: {ah} != {bh}"
              print(f"reference-identical {main_id}.json {ah[:16]}")
          PY
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 11009 --main 11013 --main 11014 --main 11015 \
            --include-reference-only --only-differences --json chapter1205-audit.json
          python tools/filter_quest_prerequisite_consensus.py \
            chapter1205-audit.json \
            --main 11009 --main 11013 --main 11014 --main 11015 \
            --consensus-count 2 --json chapter1205-consensus.json

      - name: Audit source loss and emit manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}
          mains = (11009, 11013, 11014, 11015)
          def meaningful(row):
              value = row.get("acceptCond")
              if not isinstance(value, list): return []
              return [x for x in value if isinstance(x, dict) and x.get("type")]
          def normalized(row):
              out=[]
              for entry in row.get("acceptCond") or []:
                  if not isinstance(entry, dict) or not entry.get("type"): continue
                  params = entry.get("param") or []
                  if entry.get("type") in STATE_TYPES: params=params[:2]
                  out.append({"type":entry.get("type"),"param":params,"param_str":entry.get("param_str",entry.get("paramStr", "")) or ""})
              return out
          total=match=missing=other=0
          for main_id in mains:
              cur=json.loads((Path("BinOutput/Quest")/f"{main_id}.json").read_text(encoding="utf-8"))
              ref=json.loads((Path("ref3700/BinOutput/Quest")/f"{main_id}.json").read_text(encoding="utf-8"))
              cur_by={int(x["subId"]):x for x in cur.get("subQuests",[])}
              ref_by={int(x["subId"]):x for x in ref.get("subQuests",[])}
              print(f"membership main={main_id} current={len(cur_by)} reference={len(ref_by)} current-only={sorted(set(cur_by)-set(ref_by))} ref-only={sorted(set(ref_by)-set(cur_by))}")
              for sid in sorted(set(cur_by)&set(ref_by)):
                  got=meaningful(cur_by[sid]); exp=meaningful(ref_by[sid]); total+=1
                  if got==exp: match+=1
                  elif not got and exp: missing+=1
                  else:
                      other+=1
                      print(f"source-other main={main_id} sub={sid} current={got!r} expected={exp!r}")
              for row in sorted(ref.get("subQuests",[]), key=lambda x:int(x.get("subId") or 0)):
                  sid=int(row["subId"]); comb=row.get("acceptCondComb") or "LOGIC_AND"
                  accept=json.dumps(normalized(row),ensure_ascii=False,separators=(",",":"))
                  print(f"manifest main={main_id} sub={sid} comb={comb} accept={accept}")
          print(f"source-summary-all total={total} match={match} missing={missing} other={other}")
          PY
