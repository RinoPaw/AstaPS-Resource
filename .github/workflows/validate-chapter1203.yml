name: Validate Chapter 1203 prerequisite restoration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-chapter1203.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cumulative prerequisite subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/400.json
            BinOutput/Quest/1000.json
            BinOutput/Quest/1002.json
            BinOutput/Quest/1003.json
            BinOutput/Quest/1008.json
            BinOutput/Quest/1009.json
            BinOutput/Quest/1010.json
            BinOutput/Quest/1011.json
            BinOutput/Quest/1012.json
            BinOutput/Quest/1013.json
            BinOutput/Quest/1014.json
            BinOutput/Quest/1015.json
            BinOutput/Quest/1016.json
            BinOutput/Quest/1018.json
            BinOutput/Quest/1020.json
            BinOutput/Quest/1021.json
            BinOutput/Quest/1022.json
            BinOutput/Quest/1023.json
            BinOutput/Quest/1024.json
            BinOutput/Quest/1025.json
            BinOutput/Quest/18000.json
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json
            BinOutput/Quest/2011.json
            BinOutput/Quest/2012.json
            BinOutput/Quest/2013.json
            BinOutput/Quest/2003.json
            BinOutput/Quest/2004.json
            BinOutput/Quest/2005.json
            BinOutput/Quest/2006.json
            BinOutput/Quest/2007.json
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2008.json
            BinOutput/Quest/2009.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile repair tools
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_inazuma_chapter1201.py \
            tools/fix_inazuma_chapter1202.py \
            tools/fix_inazuma_chapter1203.py \
            tools/audit_quest_prerequisite_drift.py

      - name: Require exact current damage shape
        run: |
          set +e
          python tools/fix_inazuma_chapter1203.py --check
          status=$?
          set -e
          test "$status" -eq 1

      - name: Simulate Chapter 1203 restoration
        run: |
          python tools/fix_inazuma_chapter1203.py
          python tools/fix_inazuma_chapter1203.py --check
          git diff --check

          python - <<'PY'
          import subprocess
          allowed = {
              "BinOutput/Quest/2008.json",
              "BinOutput/Quest/2009.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"expected exactly {sorted(allowed)}, got {sorted(changed)}")
          print("validated Chapter 1203 modified path allowlist")
          PY

      - name: Re-audit restored graph against both references
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 2008 --main 2009 \
            --include-reference-only \
            --only-differences \
            --json chapter1203-after-simulated-repair.json

          python - <<'PY'
          import json
          report = json.load(open("chapter1203-after-simulated-repair.json", encoding="utf-8"))
          diffs = [row for row in report["rows"] if row["classification"] != "match"]
          if diffs:
              raise SystemExit(f"Chapter 1203 still has prerequisite differences: {diffs}")
          if report["counts"].get("match") != 39:
              raise SystemExit(f"expected 39 consensus matches, got {report['counts']}")
          if report["reference_disagreements"] or report["partial_reference_coverage"]:
              raise SystemExit(f"reference coverage is not clean: {report}")
          print("PASS: Chapter 1203 prerequisite graph = 39/39 historical consensus")
          PY
