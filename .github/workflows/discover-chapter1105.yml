name: Discover Chapter 1105 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1105.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1105 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/18000.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/18000.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/18000.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify historical identity
        run: |
          python -m py_compile tools/audit_quest_prerequisite_drift.py tools/filter_quest_prerequisite_consensus.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          a = Path("ref3700/BinOutput/Quest/18000.json")
          b = Path("ref4000/BinOutput/Quest/18000.json")
          ah = hashlib.sha256(a.read_bytes()).hexdigest()
          bh = hashlib.sha256(b.read_bytes()).hexdigest()
          print(f"reference 3700={ah}")
          print(f"reference 4000={bh}")
          assert ah == bh, f"Chapter 1105 references disagree at file level: {ah} != {bh}"
          PY

      - name: Audit flattened prerequisite graph
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 18000 \
            --only-differences \
            --json chapter1105-audit.json

          python tools/filter_quest_prerequisite_consensus.py \
            chapter1105-audit.json \
            --main 18000 \
            --consensus-count 2 \
            --json chapter1105-consensus.json

      - name: Audit current BinOutput source loss
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def meaningful(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [x for x in value if isinstance(x, dict) and x.get("type")]

          cur = json.loads(Path("BinOutput/Quest/18000.json").read_text(encoding="utf-8"))
          ref = json.loads(Path("ref3700/BinOutput/Quest/18000.json").read_text(encoding="utf-8"))
          cur_by_id = {int(x["subId"]): x for x in cur.get("subQuests", [])}
          ref_by_id = {int(x["subId"]): x for x in ref.get("subQuests", [])}
          print(f"current-subquests={len(cur_by_id)} reference-subquests={len(ref_by_id)}")
          assert set(cur_by_id) == set(ref_by_id), f"subquest membership drift current-only={sorted(set(cur_by_id)-set(ref_by_id))} ref-only={sorted(set(ref_by_id)-set(cur_by_id))}"

          match = missing = other = 0
          for sid in sorted(ref_by_id):
              got = meaningful(cur_by_id[sid])
              exp = meaningful(ref_by_id[sid])
              if got == exp:
                  match += 1
              elif not got and exp:
                  missing += 1
              else:
                  other += 1
                  print(f"source-other sub={sid} current={got!r} expected={exp!r}")
          print(f"source-summary total={len(ref_by_id)} match={match} missing={missing} other={other}")
          PY

      - name: Emit normalized prerequisite manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def meaningful(row):
              out = []
              for entry in row.get("acceptCond") or []:
                  if not isinstance(entry, dict) or not entry.get("type"):
                      continue
                  params = entry.get("param") or []
                  if entry.get("type") in ("QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"):
                      params = params[:2]
                  out.append({
                      "type": entry.get("type"),
                      "param": params,
                      "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
                  })
              return out

          ref = json.loads(Path("ref3700/BinOutput/Quest/18000.json").read_text(encoding="utf-8"))
          for row in sorted(ref.get("subQuests", []), key=lambda x: int(x.get("subId") or 0)):
              sid = int(row["subId"])
              comb = row.get("acceptCondComb") or "LOGIC_AND"
              print(f"manifest {sid} comb={comb} accept={json.dumps(meaningful(row), ensure_ascii=False, separators=(',', ':'))}")
          PY
