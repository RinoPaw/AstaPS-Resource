name: Discover Chapter 1202 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1202.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1202 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/2011.json
            BinOutput/Quest/2012.json
            BinOutput/Quest/2013.json
            BinOutput/Quest/2003.json
            BinOutput/Quest/2004.json
            BinOutput/Quest/2005.json
            BinOutput/Quest/2006.json
            BinOutput/Quest/2007.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2011.json
            BinOutput/Quest/2012.json
            BinOutput/Quest/2013.json
            BinOutput/Quest/2003.json
            BinOutput/Quest/2004.json
            BinOutput/Quest/2005.json
            BinOutput/Quest/2006.json
            BinOutput/Quest/2007.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2011.json
            BinOutput/Quest/2012.json
            BinOutput/Quest/2013.json
            BinOutput/Quest/2003.json
            BinOutput/Quest/2004.json
            BinOutput/Quest/2005.json
            BinOutput/Quest/2006.json
            BinOutput/Quest/2007.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify references and compile audit tools
        run: |
          python -m py_compile tools/audit_quest_prerequisite_drift.py tools/filter_quest_prerequisite_consensus.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          mains = (2011, 2012, 2013, 2003, 2004, 2005, 2006, 2007)
          for main_id in mains:
              a = Path("ref3700/BinOutput/Quest") / f"{main_id}.json"
              b = Path("ref4000/BinOutput/Quest") / f"{main_id}.json"
              ah = hashlib.sha256(a.read_bytes()).hexdigest()
              bh = hashlib.sha256(b.read_bytes()).hexdigest()
              assert ah == bh, f"reference mismatch for {main_id}: {ah} != {bh}"
              print(f"reference-identical {main_id}.json {ah[:16]}")
          PY

      - name: Audit flattened Chapter 1202 graph
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 2011 --main 2012 --main 2013 --main 2003 --main 2004 --main 2005 --main 2006 --main 2007 \
            --include-reference-only \
            --only-differences \
            --json chapter1202-audit.json

          python tools/filter_quest_prerequisite_consensus.py \
            chapter1202-audit.json \
            --main 2011 --main 2012 --main 2013 --main 2003 --main 2004 --main 2005 --main 2006 --main 2007 \
            --consensus-count 2 \
            --json chapter1202-consensus.json

      - name: Audit current BinOutput source loss
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def meaningful(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [x for x in value if isinstance(x, dict) and x.get("type")]

          mains = (2011, 2012, 2013, 2003, 2004, 2005, 2006, 2007)
          grand_total = grand_match = grand_missing = grand_other = 0
          for main_id in mains:
              cur = json.loads((Path("BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              ref = json.loads((Path("ref3700/BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              cur_by_id = {int(x["subId"]): x for x in cur.get("subQuests", [])}
              ref_by_id = {int(x["subId"]): x for x in ref.get("subQuests", [])}
              if set(cur_by_id) != set(ref_by_id):
                  print(f"membership-drift main={main_id} current-only={sorted(set(cur_by_id)-set(ref_by_id))} ref-only={sorted(set(ref_by_id)-set(cur_by_id))}")
              match = missing = other = 0
              for sid in sorted(set(cur_by_id) & set(ref_by_id)):
                  got = meaningful(cur_by_id[sid])
                  exp = meaningful(ref_by_id[sid])
                  if got == exp:
                      match += 1
                  elif not got and exp:
                      missing += 1
                  else:
                      other += 1
                      print(f"source-other main={main_id} sub={sid} current={got!r} expected={exp!r}")
              total = len(set(cur_by_id) & set(ref_by_id))
              print(f"source-summary main={main_id} total={total} match={match} missing={missing} other={other}")
              grand_total += total
              grand_match += match
              grand_missing += missing
              grand_other += other
          print(f"source-summary-all total={grand_total} match={grand_match} missing={grand_missing} other={grand_other}")
          PY

      - name: Emit complete normalized historical manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}
          mains = (2011, 2012, 2013, 2003, 2004, 2005, 2006, 2007)

          def normalized(row):
              out = []
              for entry in row.get("acceptCond") or []:
                  if not isinstance(entry, dict) or not entry.get("type"):
                      continue
                  params = entry.get("param") or []
                  if entry.get("type") in STATE_TYPES:
                      params = params[:2]
                  out.append({
                      "type": entry.get("type"),
                      "param": params,
                      "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
                  })
              return out

          total = 0
          for main_id in mains:
              doc = json.loads((Path("ref3700/BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              rows = sorted(doc.get("subQuests", []), key=lambda x: int(x.get("subId") or 0))
              print(f"manifest-main={main_id} count={len(rows)}")
              for row in rows:
                  sid = int(row["subId"])
                  comb = row.get("acceptCondComb") or "LOGIC_AND"
                  accept = json.dumps(normalized(row), ensure_ascii=False, separators=(",", ":"))
                  print(f"manifest main={main_id} sub={sid} comb={comb} accept={accept}")
                  total += 1
          print(f"manifest-total={total}")
          PY
