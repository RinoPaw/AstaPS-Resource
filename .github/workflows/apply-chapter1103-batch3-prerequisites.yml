name: Apply Chapter 1103 MQ1023 repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-chapter1103-batch3-prerequisites.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/400.json
            BinOutput/Quest/1000.json
            BinOutput/Quest/1002.json
            BinOutput/Quest/1003.json
            BinOutput/Quest/1008.json
            BinOutput/Quest/1009.json
            BinOutput/Quest/1010.json
            BinOutput/Quest/1011.json
            BinOutput/Quest/1012.json
            BinOutput/Quest/1013.json
            BinOutput/Quest/1014.json
            BinOutput/Quest/1015.json
            BinOutput/Quest/1016.json
            BinOutput/Quest/1018.json
            BinOutput/Quest/1020.json
            BinOutput/Quest/1021.json
            BinOutput/Quest/1022.json
            BinOutput/Quest/1023.json
            ExcelBinOutput/QuestExcelConfigData.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply strict MQ1023 repair
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_liyue_act1_branches.py \
            tools/fix_liyue_chapter1102.py \
            tools/fix_liyue_chapter1103.py
          python tools/fix_liyue_chapter1103.py
          python tools/fix_liyue_chapter1103.py --check
          git diff --check

      - name: Verify modified path allowlist
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "BinOutput/Quest/1023.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected modified paths: {unexpected}")
          if changed != allowed:
              raise SystemExit(f"expected exactly {sorted(allowed)}, got {sorted(changed)}")
          print("validated MQ1023 modified path allowlist")
          PY

      - name: Commit repaired resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            BinOutput/Quest/1023.json \
            ExcelBinOutput/QuestExcelConfigData.json
          git commit -m "fix: restore Liyue MQ1023 prerequisite graph [skip ci]"
          git push origin HEAD:main
