name: Apply Rino QuestExcel overlay

on:
  push:
    branches: [play/rino]
    paths:
      - ".github/workflows/apply-rino-questexcel-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play/rino
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply audited overlays to complete upstream QuestExcel
        run: python tools/upgrade_questexcel_from_repaired_quest.py

      - name: Verify overlay is idempotent
        run: python tools/upgrade_questexcel_from_repaired_quest.py --check

      - name: Verify JSON population
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("ExcelBinOutput/QuestExcelConfigData.json")
          rows = json.loads(path.read_text(encoding="utf-8"))
          ids = [row["subId"] for row in rows]
          assert len(rows) == 33217, len(rows)
          assert len(ids) == len(set(ids)) == 33217
          print("QuestExcel rows:", len(rows))
          PY

      - name: Commit upgraded QuestExcel
        run: |
          if git diff --quiet -- ExcelBinOutput/QuestExcelConfigData.json; then
            echo "QuestExcel is already current."
            exit 0
          fi
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add ExcelBinOutput/QuestExcelConfigData.json
          git commit -m "fix: overlay audited quest repairs onto complete QuestExcel [skip ci]"
          git push origin HEAD:play/rino
