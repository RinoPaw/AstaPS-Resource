name: Apply Chapter 1301 prerequisite repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chapter1301-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current resources
        uses: actions/checkout@v4
        with:
          path: current
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            docs/quest-prerequisite-audit-handoff.md
            .github/workflows/quest-prerequisite-audit.yml
            ExcelBinOutput/ChapterExcelConfigData.json
            ExcelBinOutput/QuestExcelConfigData.json
            BinOutput/Quest/3000.json
            BinOutput/Quest/3001.json
            BinOutput/Quest/3002.json
            BinOutput/Quest/3003.json
            BinOutput/Quest/3004.json
            BinOutput/Quest/3005.json
            BinOutput/Quest/3006.json

      - name: Checkout decoded 3.7-era reference
        uses: actions/checkout@v4
        with:
          repository: wander-in-wind/TsvParser
          ref: 249e7cb402c31f0f21ac649d5879a6f91007dc12
          path: tsv37
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/main/resources/json/3000.json
            src/main/resources/json/3001.json
            src/main/resources/json/3002.json
            src/main/resources/json/3003.json
            src/main/resources/json/3004.json
            src/main/resources/json/3005.json
            src/main/resources/json/3006.json

      - name: Checkout decoded later reference
        uses: actions/checkout@v4
        with:
          repository: capyb2222/LunaGC-Resources
          ref: 395a5ee6442142a803691f60d541ee1706ae9cd7
          path: luna
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/3000.json
            BinOutput/Quest/3001.json
            BinOutput/Quest/3002.json
            BinOutput/Quest/3003.json
            BinOutput/Quest/3004.json
            BinOutput/Quest/3005.json
            BinOutput/Quest/3006.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate strict Chapter 1301 manifest from decoded consensus
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import pprint
          import sys
          from collections import Counter
          from pathlib import Path

          MAINS = range(3000, 3007)
          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}
          GLOBAL_VAR_EQUAL = "QUEST_COND_QUEST_GLOBAL_VAR_EQUAL"
          DEFAULT_COMBS = {None, "", "LOGIC_NONE"}

          sys.path.insert(0, "current/tools")
          from fix_quest_prerequisites import normalize_accept

          def load(path: str | Path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def rows(document):
              return {
                  int(row["subId"]): row
                  for row in document.get("subQuests", [])
                  if isinstance(row, dict) and row.get("subId") is not None
              }

          def scalar(value):
              if isinstance(value, str):
                  try:
                      return int(value)
                  except ValueError:
                      return value
              return value

          def comparison_condition(entry):
              params = entry.get("param", [])
              if not isinstance(params, list):
                  params = []
              params = [scalar(value) for value in params]
              cond_type = entry.get("type")
              if cond_type in STATE_TYPES and len(params) >= 2:
                  params = params[:2]
              if cond_type == GLOBAL_VAR_EQUAL and len(params) == 1:
                  params.append(0)
              return {
                  "type": cond_type,
                  "param": params,
                  "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
              }

          def comparison_accept(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [
                  comparison_condition(entry)
                  for entry in value
                  if isinstance(entry, dict) and entry.get("type")
              ]

          def effective_comb(row):
              value = row.get("acceptCondComb")
              return "LOGIC_AND" if value in DEFAULT_COMBS else value

          def signature(row):
              return comparison_accept(row), effective_comb(row)

          def materialize_condition(entry):
              params = entry.get("param", [])
              if not isinstance(params, list):
                  params = []
              return {
                  "type": entry.get("type"),
                  "param": [scalar(value) for value in params],
                  "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
              }

          def materialize_accept(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [
                  materialize_condition(entry)
                  for entry in value
                  if isinstance(entry, dict) and entry.get("type")
              ]

          current_excel = load("current/ExcelBinOutput/QuestExcelConfigData.json")
          flat = {
              int(row["subId"]): row
              for row in current_excel
              if isinstance(row, dict) and int(row.get("mainId") or 0) in MAINS
          }

          manifest = []
          shared_ids = []
          drift_count = 0
          condition_types = Counter()
          nondefault_combiners = Counter()
          current_only = []

          for main_id in MAINS:
              current_doc = load(f"current/BinOutput/Quest/{main_id}.json")
              old_doc = load(f"tsv37/src/main/resources/json/{main_id}.json")
              later_doc = load(f"luna/BinOutput/Quest/{main_id}.json")
              current_rows = rows(current_doc)
              old_rows = rows(old_doc)
              later_rows = rows(later_doc)

              assert set(old_rows) == set(later_rows), (
                  main_id,
                  sorted(set(old_rows) - set(later_rows)),
                  sorted(set(later_rows) - set(old_rows)),
              )
              current_only.extend((main_id, sub_id) for sub_id in sorted(set(current_rows) - set(later_rows)))

              for sub_id in sorted(later_rows):
                  old_row = old_rows[sub_id]
                  later_row = later_rows[sub_id]
                  assert signature(old_row) == signature(later_row), (
                      main_id,
                      sub_id,
                      signature(old_row),
                      signature(later_row),
                  )
                  assert sub_id in current_rows, (main_id, sub_id, "missing current source row")
                  assert not comparison_accept(current_rows[sub_id]), (
                      main_id,
                      sub_id,
                      "unexpected nonempty current source acceptCond",
                      comparison_accept(current_rows[sub_id]),
                  )
                  assert sub_id in flat, (main_id, sub_id, "missing current flattened row")

                  expected_accept = materialize_accept(later_row)
                  expected_signature = signature(later_row)
                  damaged_accept = []
                  if comparison_accept(flat[sub_id]) != expected_signature[0]:
                      damaged_accept.append(materialize_accept(flat[sub_id]))
                      drift_count += 1

                  raw_comb = later_row.get("acceptCondComb")
                  expected_comb = None if effective_comb(later_row) == "LOGIC_AND" else raw_comb
                  damaged_comb = []
                  if expected_comb is not None:
                      nondefault_combiners[expected_comb] += 1
                      for probe in (current_rows[sub_id], flat[sub_id]):
                          current_comb = probe.get("acceptCondComb")
                          if (
                              current_comb != expected_comb
                              and current_comb not in DEFAULT_COMBS
                              and current_comb not in damaged_comb
                          ):
                              damaged_comb.append(current_comb)

                  for condition in comparison_accept(later_row):
                      condition_types[condition["type"]] += 1

                  manifest.append(
                      (
                          f"{main_id}.json",
                          main_id,
                          sub_id,
                          expected_accept,
                          damaged_accept,
                          expected_comb,
                          damaged_comb,
                      )
                  )
                  shared_ids.append(sub_id)

          assert len(manifest) == 110, len(manifest)
          assert len(shared_ids) == len(set(shared_ids)) == 110
          assert drift_count == 26, drift_count
          assert current_only == [(3000, 300012)], current_only
          assert "QUEST_COND_UNKNOWN" not in condition_types, condition_types
          assert nondefault_combiners == Counter({"LOGIC_A_OR_ETCAND": 1}), nondefault_combiners

          current_3000 = rows(load("current/BinOutput/Quest/3000.json"))
          Path("chapter1301-300012-before.json").write_text(
              json.dumps(current_3000[300012], ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          rows_literal = pprint.pformat(tuple(manifest), width=100, sort_dicts=False)
          script = f'''#!/usr/bin/env python3
          from __future__ import annotations

          import fix_chapter1207_prerequisites  # noqa: F401 - extends the shared manifest on import
          import fix_liyue_prerequisites as base
          from fix_quest_prerequisites import Repair

          # Chapter 1301 prerequisite repairs.
          # Evidence: exact decoded prerequisite consensus between a 3.7-era TsvParser snapshot
          # (249e7cb402c31f0f21ac649d5879a6f91007dc12) and LunaGC-Resources
          # (395a5ee6442142a803691f60d541ee1706ae9cd7). TomyJan GCResource 3.7/4.0
          # both export these rows as QUEST_COND_UNKNOWN, so they are intentionally not used as
          # semantic targets for this chapter. Kei-Luna 4.6 independently confirms the one
          # representation edge case: a trailing zero omitted by the old TSV exporter on 300107.
          #
          # Current 7.1 BinOutput retains all 110 historical rows but lost every meaningful
          # acceptCond. Flattened QuestExcel retains all 110 rows: 84 are already semantically
          # correct and 26 have prerequisite drift. Current-only 300012 is intentionally untouched.
          _ROWS = {rows_literal}

          CHAPTER_1301_REPAIRS = tuple(
              Repair(
                  json_file,
                  main_id,
                  sub_id,
                  -1,
                  tuple(dict(entry) for entry in expected_accept),
                  tuple(tuple(dict(entry) for entry in variant) for variant in damaged_accept),
                  expected_comb=expected_comb,
                  damaged_comb=tuple(damaged_comb),
              )
              for (
                  json_file,
                  main_id,
                  sub_id,
                  expected_accept,
                  damaged_accept,
                  expected_comb,
                  damaged_comb,
              ) in _ROWS
          )

          base.REPAIRS += CHAPTER_1301_REPAIRS

          def main() -> int:
              # Direct invocation stays scoped to Chapter 1301. Importing this module extends
              # the cumulative manifest used by permanent CI.
              cumulative = base.REPAIRS
              base.REPAIRS = CHAPTER_1301_REPAIRS
              try:
                  return base.main()
              finally:
                  base.REPAIRS = cumulative

          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          import textwrap
          script = textwrap.dedent(script)
          Path("current/tools/fix_chapter1301_prerequisites.py").write_text(script, encoding="utf-8")

          print(f"Generated Chapter 1301 static manifest: {len(manifest)} rows")
          print(f"Observed flattened prerequisite drift: {drift_count} rows")
          print(f"Condition types: {dict(sorted(condition_types.items()))}")
          print(f"Non-default combiners: {dict(sorted(nondefault_combiners.items()))}")
          print(f"Current-only rows left untouched: {current_only}")
          PY

      - name: Compile and apply Chapter 1301 repair
        working-directory: current
        run: |
          python -m py_compile tools/fix_chapter1301_prerequisites.py
          python tools/fix_chapter1301_prerequisites.py
          python tools/fix_chapter1301_prerequisites.py --check

      - name: Verify repaired source and flattened rows against decoded consensus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          MAINS = range(3000, 3007)
          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}
          GLOBAL_VAR_EQUAL = "QUEST_COND_QUEST_GLOBAL_VAR_EQUAL"
          DEFAULT_COMBS = {None, "", "LOGIC_NONE"}

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def rows(doc):
              return {
                  int(row["subId"]): row
                  for row in doc.get("subQuests", [])
                  if isinstance(row, dict) and row.get("subId") is not None
              }

          def scalar(value):
              if isinstance(value, str):
                  try:
                      return int(value)
                  except ValueError:
                      return value
              return value

          def accept(row):
              out = []
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return out
              for entry in value:
                  if not isinstance(entry, dict) or not entry.get("type"):
                      continue
                  params = entry.get("param", [])
                  if not isinstance(params, list):
                      params = []
                  params = [scalar(v) for v in params]
                  cond_type = entry["type"]
                  if cond_type in STATE_TYPES and len(params) >= 2:
                      params = params[:2]
                  if cond_type == GLOBAL_VAR_EQUAL and len(params) == 1:
                      params.append(0)
                  out.append((cond_type, tuple(params), entry.get("param_str", entry.get("paramStr", "")) or ""))
              return out

          def comb(row):
              value = row.get("acceptCondComb")
              return "LOGIC_AND" if value in DEFAULT_COMBS else value

          def signature(row):
              return accept(row), comb(row)

          flat_doc = load("current/ExcelBinOutput/QuestExcelConfigData.json")
          flat = {
              int(row["subId"]): row
              for row in flat_doc
              if isinstance(row, dict) and int(row.get("mainId") or 0) in MAINS
          }

          checked = 0
          for main_id in MAINS:
              current_rows = rows(load(f"current/BinOutput/Quest/{main_id}.json"))
              old_rows = rows(load(f"tsv37/src/main/resources/json/{main_id}.json"))
              later_rows = rows(load(f"luna/BinOutput/Quest/{main_id}.json"))
              assert set(old_rows) == set(later_rows)
              for sub_id in sorted(later_rows):
                  expected = signature(later_rows[sub_id])
                  assert signature(old_rows[sub_id]) == expected, (main_id, sub_id, "reference drift")
                  assert signature(current_rows[sub_id]) == expected, (main_id, sub_id, "source repair mismatch")
                  assert signature(flat[sub_id]) == expected, (main_id, sub_id, "flat repair mismatch")
                  checked += 1

          before = json.loads(Path("chapter1301-300012-before.json").read_text(encoding="utf-8"))
          after = rows(load("current/BinOutput/Quest/3000.json"))[300012]
          assert before == after, "current-only subquest 300012 changed unexpectedly"
          assert checked == 110, checked
          print("Post-repair decoded-reference audit: 110/110 source and flat rows match.")
          print("Current-only subquest 300012 is byte-semantically unchanged.")
          PY

      - name: Extend permanent audit and handoff
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          workflow_path = Path("current/.github/workflows/quest-prerequisite-audit.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '      - "tools/fix_chapter1207_prerequisites.py"\n',
                  '      - "tools/fix_chapter1207_prerequisites.py"\n      - "tools/fix_chapter1301_prerequisites.py"\n',
              ),
              (
                  '            BinOutput/Quest/1031.json\n',
                  '            BinOutput/Quest/1031.json\n            BinOutput/Quest/3000.json\n            BinOutput/Quest/3001.json\n            BinOutput/Quest/3002.json\n            BinOutput/Quest/3003.json\n            BinOutput/Quest/3004.json\n            BinOutput/Quest/3005.json\n            BinOutput/Quest/3006.json\n',
              ),
              (
                  '            tools/fix_chapter1207_prerequisites.py\n',
                  '            tools/fix_chapter1207_prerequisites.py \\\n            tools/fix_chapter1301_prerequisites.py\n',
              ),
              (
                  '      - name: Verify cumulative prerequisite graph through Chapter 1207\n',
                  '      - name: Verify cumulative prerequisite graph through Chapter 1301\n',
              ),
              (
                  '          import fix_chapter1207_prerequisites as entry\n',
                  '          import fix_chapter1301_prerequisites as entry\n',
              ),
              (
                  '          assert len(ids) == 678, f"expected 678 cumulative repair rows, got {len(ids)}"\n',
                  '          assert len(ids) == 788, f"expected 788 cumulative repair rows, got {len(ids)}"\n',
              ),
              (
                  '          print("Cumulative prerequisite graph through Chapter 1207 is clean and idempotent.")\n',
                  '          print("Cumulative prerequisite graph through Chapter 1301 is clean and idempotent.")\n',
              ),
          ]
          for old, new in replacements:
              count = workflow.count(old)
              assert count == 1, ("permanent workflow replacement count", old, count)
              workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow, encoding="utf-8")

          handoff_path = Path("current/docs/quest-prerequisite-audit-handoff.md")
          handoff = handoff_path.read_text(encoding="utf-8")
          simple = [
              ("Updated: 2026-10-04", "Updated: 2026-10-05"),
              (
                  "## Current status: audited and repaired through Chapter 1207",
                  "## Current status: audited and repaired through Chapter 1301",
              ),
              (
                  "The prerequisite repair now covers the Mondstadt Prologue, Liyue old-content chapters, Inazuma chapters through 1204, Liyue Interlude Chapter 1205, Chapter 1206, and Chapter 1207.",
                  "The prerequisite repair now covers the Mondstadt Prologue, Liyue old-content chapters, Inazuma chapters through 1204, Liyue Interlude Chapter 1205, Chapters 1206-1207, and Sumeru Chapter 1301.",
              ),
              ("regular strict Repair manifest: 678 unique subquests", "regular strict Repair manifest: 788 unique subquests"),
              (
                  "1. the 678 unique regular `Repair` rows through Chapter 1207;",
                  "1. the 788 unique regular `Repair` rows through Chapter 1301;",
              ),
              (
                  "### `tools/fix_chapter1207_prerequisites.py`\n\nChapter 1207 strict static manifest, 88 rows.\n",
                  "### `tools/fix_chapter1207_prerequisites.py`\n\nChapter 1207 strict static manifest, 88 rows.\n\n### `tools/fix_chapter1301_prerequisites.py`\n\nChapter 1301 strict static manifest, 110 rows, generated from independently decoded historical prerequisite consensus.\n",
              ),
          ]
          for old, new in simple:
              count = handoff.count(old)
              assert count == 1, ("handoff replacement count", old, count)
              handoff = handoff.replace(old, new)

          evidence_anchor = "Whole-file byte identity is useful evidence but is not required.\n"
          evidence_note = """

Chapter 1301 adds an important evidence rule: apparent agreement on `QUEST_COND_UNKNOWN` is not semantic consensus. TomyJan GCResource 3.7 and 4.0 both export all 110 shared Chapter 1301 prerequisite rows as `QUEST_COND_UNKNOWN [0,0]`, so those rows are unusable as repair targets. For this chapter the accepted semantic evidence is exact decoded agreement between the 3.7-era `wander-in-wind/TsvParser` snapshot `249e7cb4` and `capyb2222/LunaGC-Resources` snapshot `395a5ee6`; `Kei-Luna/LunaGC_Resources_4.6.0` independently confirms the single omitted-trailing-zero representation edge case on subquest 300107.
"""
          assert handoff.count(evidence_anchor) == 1
          handoff = handoff.replace(evidence_anchor, evidence_anchor + evidence_note)

          chapters = json.loads(Path("current/ExcelBinOutput/ChapterExcelConfigData.json").read_text(encoding="utf-8"))
          next_candidates = [
              row
              for row in chapters
              if isinstance(row, dict)
              and row.get("IMFDDPKLIDD") == "CHAPTER_STYLE_TYPE_AQ"
              and isinstance(row.get("id"), int)
              and row["id"] > 1301
          ]
          assert next_candidates, "no AQ chapter after 1301"
          next_chapter = min(next_candidates, key=lambda row: row["id"])
          next_id = next_chapter["id"]
          next_begin = next_chapter.get("beginQuestId")
          next_end = next_chapter.get("endQuestId")
          next_city = next_chapter.get("cityId")
          next_level = next_chapter.get("needPlayerLevel")
          next_terminal = int(next_end) // 100 if isinstance(next_end, int) else "resolve-from-chain"

          completed = f'''## Chapter 1301

Resolved MQ chain from current resource `suggestTrackMainQuestList`:

```text
3000 -> 3001 -> 3002 -> 3003 -> 3004 -> 3005 -> 3006
ChapterExcel range: 300002 -> 300612
```

The original TomyJan GCResource 3.7/4.0 exports are not usable semantic references for this chapter: all 110 shared prerequisite rows decode as `QUEST_COND_UNKNOWN [0,0]` in both branches. A decoded 3.7-era TsvParser snapshot and a later LunaGC resource snapshot instead have exact prerequisite-semantic agreement on all 110 rows after normalizing one exporter representation detail (`QUEST_COND_QUEST_GLOBAL_VAR_EQUAL [300107]` means the schema-default `[300107,0]`; a 4.6 decoded snapshot independently confirms the two-operand form).

Current 7.1 before repair:

```text
historical/shared source rows present: 110/110
meaningful source acceptCond missing: 110/110
flattened rows present: 110/110
flattened rows already correct: 84
flattened prerequisite drift: 26
current-only row: 300012 (left untouched)
```

Historical decoded condition inventory across the 110 shared rows:

```text
QUEST_COND_STATE_EQUAL: 111
QUEST_COND_QUEST_GLOBAL_VAR_EQUAL: 3
non-default effective combiner: LOGIC_A_OR_ETCAND (1 row)
```

`tools/fix_chapter1301_prerequisites.py` is a generated, reviewable 110-row strict manifest. It restores all 110 source prerequisites, rewrites only the 26 observed flattened damaged shapes, refuses unexpected nonempty source/flattened shapes, and deliberately excludes the 7.1-only subquest `300012`.

The apply gate verifies a second idempotent pass, `git diff --check`, an exact modified-path allowlist, unchanged `300012`, and 110/110 post-repair matches against both decoded references.

## Next task: Chapter {next_id}

The next chronological Archon chapter in current `ChapterExcelConfigData.json` is Chapter {next_id}:

```text
beginQuestId: {next_begin}
endQuestId:   {next_end}
terminal MQ:  {next_terminal}
cityId:       {next_city}
needPlayerLevel: {next_level}
```

Resolve its exact MQ chain from `suggestTrackMainQuestList`, establish usable decoded historical prerequisite evidence before generating a manifest, then repeat the same source + flattened audit/repair/idempotence/CI process.
'''

          pattern = re.compile(r"## Next task: Chapter 1301\n.*?(?=\n## Safety / methodology rules)", re.S)
          handoff, count = pattern.subn(completed.rstrip(), handoff)
          assert count == 1, count
          handoff_path.write_text(handoff, encoding="utf-8")
          print(f"Permanent CI extended to 788 regular repairs; next AQ chapter is {next_id}.")
          PY

      - name: Enforce exact diff and idempotence
        run: |
          git -C current add -N tools/fix_chapter1301_prerequisites.py
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/quest-prerequisite-audit.yml",
              "BinOutput/Quest/3000.json",
              "BinOutput/Quest/3001.json",
              "BinOutput/Quest/3002.json",
              "BinOutput/Quest/3003.json",
              "BinOutput/Quest/3004.json",
              "BinOutput/Quest/3005.json",
              "BinOutput/Quest/3006.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
              "docs/quest-prerequisite-audit-handoff.md",
              "tools/fix_chapter1301_prerequisites.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "-C", "current", "diff", "--name-only"], text=True
              ).splitlines()
          )
          assert actual == expected, ("unexpected modified paths", sorted(actual), sorted(expected))
          print("Exact modified-path allowlist passed:")
          for path in sorted(actual):
              print(f"  {path}")
          PY
          git -C current diff --check
          cd current
          python tools/fix_chapter1301_prerequisites.py --check
          python -m py_compile tools/fix_chapter1301_prerequisites.py

      - name: Commit repaired Chapter 1301 resources
        working-directory: current
        run: |
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add \
            tools/fix_chapter1301_prerequisites.py \
            BinOutput/Quest/3000.json \
            BinOutput/Quest/3001.json \
            BinOutput/Quest/3002.json \
            BinOutput/Quest/3003.json \
            BinOutput/Quest/3004.json \
            BinOutput/Quest/3005.json \
            BinOutput/Quest/3006.json \
            ExcelBinOutput/QuestExcelConfigData.json \
            .github/workflows/quest-prerequisite-audit.yml \
            docs/quest-prerequisite-audit-handoff.md
          git diff --cached --check
          git commit -m "fix: restore Chapter 1301 prerequisites"
          git push origin HEAD:main
