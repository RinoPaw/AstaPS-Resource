name: Apply Chapter 1301 prerequisite repair

# This workflow was generated as a one-shot apply job. Its embedded Python contained
# unindented multiline string bodies, which made the YAML invalid and caused every
# branch push to produce an immediate 0-job failure. Keep the one-shot operation
# manual until the Chapter 1301 repair is rebuilt as a normal script/workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled one-shot apply
        run: |
          echo "Chapter 1301 one-shot apply is disabled."
          echo "Rebuild it as a normal checked-in script before applying that repair."
