name: Apply Chapter 1104 quest-row restoration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-chapter1104-quest-rows.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/8000.json
            BinOutput/Quest/8001.json
            BinOutput/Quest/8002.json
            BinOutput/Quest/8003.json
            ExcelBinOutput/QuestExcelConfigData.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply validated restoration
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_chapter1104_quest_rows.py
          python tools/fix_chapter1104_quest_rows.py
          python tools/fix_chapter1104_quest_rows.py --check
          git diff --check

      - name: Verify modified path allowlist
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              "BinOutput/Quest/8000.json",
              "BinOutput/Quest/8001.json",
              "BinOutput/Quest/8002.json",
              "BinOutput/Quest/8003.json",
              "ExcelBinOutput/QuestExcelConfigData.json",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != allowed:
              raise SystemExit(f"expected exactly {sorted(allowed)}, got {sorted(changed)}")
          print("validated Chapter 1104 modified path allowlist")
          PY

      - name: Commit repaired resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            BinOutput/Quest/8000.json \
            BinOutput/Quest/8001.json \
            BinOutput/Quest/8002.json \
            BinOutput/Quest/8003.json \
            ExcelBinOutput/QuestExcelConfigData.json
          git commit -m "fix: restore Chapter 1104 quest rows [skip ci]"
          git push origin HEAD:main
