name: Quest prerequisite audit

on:
  push:
    branches: [main]
    paths:
      - "tools/fix_quest_prerequisites.py"
      - "tools/fix_liyue_prerequisites.py"
      - "tools/fix_liyue_act1_branches.py"
      - "tools/fix_liyue_chapter1102.py"
      - "tools/fix_liyue_chapter1103.py"
      - "BinOutput/Quest/**.json"
      - "ExcelBinOutput/QuestExcelConfigData.json"
      - ".github/workflows/quest-prerequisite-audit.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/400.json
            BinOutput/Quest/1000.json
            BinOutput/Quest/1002.json
            BinOutput/Quest/1003.json
            BinOutput/Quest/1008.json
            BinOutput/Quest/1009.json
            BinOutput/Quest/1010.json
            BinOutput/Quest/1011.json
            BinOutput/Quest/1012.json
            BinOutput/Quest/1013.json
            BinOutput/Quest/1014.json
            BinOutput/Quest/1015.json
            BinOutput/Quest/1016.json
            BinOutput/Quest/1018.json
            BinOutput/Quest/1020.json
            BinOutput/Quest/1021.json
            BinOutput/Quest/1022.json
            ExcelBinOutput/QuestExcelConfigData.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile prerequisite tools
        run: |
          python -m py_compile \
            tools/fix_quest_prerequisites.py \
            tools/fix_liyue_prerequisites.py \
            tools/fix_liyue_act1_branches.py \
            tools/fix_liyue_chapter1102.py \
            tools/fix_liyue_chapter1103.py

      - name: Verify repaired baseline through MQ1021
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import fix_liyue_chapter1103 as entry
          import fix_liyue_prerequisites as base

          all_repairs = base.REPAIRS
          assert len(all_repairs) == 206, f"expected 206 cumulative repair rows, got {len(all_repairs)}"
          assert len({repair.sub_id for repair in all_repairs}) == len(all_repairs), "duplicate subId in cumulative manifest"

          base.REPAIRS = all_repairs[:-8]
          assert len(base.REPAIRS) == 198
          assert base.patch_sources(Path("BinOutput/Quest"), check=True) == 0
          assert base.patch_excel(Path("ExcelBinOutput/QuestExcelConfigData.json"), check=True) == 0
          print("Prerequisite repair baseline through MQ1021 remains clean and idempotent.")
          PY

      - name: Strict dry-check MQ1022 batch
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import fix_liyue_chapter1103 as entry
          import fix_liyue_prerequisites as base

          ids = [repair.sub_id for repair in base.REPAIRS]
          assert len(ids) == 206, f"expected 206 cumulative repair rows, got {len(ids)}"
          assert len(ids) == len(set(ids)), "duplicate subId in cumulative repair manifest"

          source_status = base.patch_sources(Path("BinOutput/Quest"), check=True)
          excel_status = base.patch_excel(
              Path("ExcelBinOutput/QuestExcelConfigData.json"), check=True
          )
          assert source_status in (0, 1)
          assert excel_status in (0, 1)
          print(
              "MQ1022 strict dry-check completed:",
              f"source_pending={bool(source_status)}",
              f"excel_pending={bool(excel_status)}",
          )
          PY
