name: tmp quest353 runtime-data discovery
on:
  push:
    paths:
      - '.github/workflows/tmp-quest352-slime-discovery.yml'
  workflow_dispatch:

# Temporary narrow validation for the early Mondstadt quest field repair.
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ExcelBinOutput/QuestExcelConfigData.json
            tools/fix_early_quest_fields.py
          sparse-checkout-cone-mode: false
      - name: Check evidence-backed early quest repairs
        shell: bash
        run: |
          set +e
          python tools/fix_early_quest_fields.py --check
          rc=$?
          echo "check_exit=$rc"
          # Exit 1 means the checker found pending repairs; keep the discovery job successful.
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
