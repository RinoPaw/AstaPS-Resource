name: tmp quest353 runtime-data discovery
on:
  push:
    paths:
      - '.github/workflows/tmp-quest352-slime-discovery.yml'
  workflow_dispatch:

# Temporary narrow inspection for the Unexpected Power quest rows.
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ExcelBinOutput/QuestExcelConfigData.json
            BinOutput/Quest/353.json
          sparse-checkout-cone-mode: false
      - name: Compare runtime and BinOutput quest 353 rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {35301, 35302, 35312}
          for path in [
              Path('ExcelBinOutput/QuestExcelConfigData.json'),
              Path('BinOutput/Quest/353.json'),
          ]:
              print(f'=== {path} ===')
              rows = json.loads(path.read_text(encoding='utf-8'))
              found = []
              for row in rows:
                  sid = row.get('subId')
                  if sid in targets:
                      found.append(sid)
                      print(json.dumps(row, ensure_ascii=False, indent=2, sort_keys=True))
              print('found:', sorted(found))
          PY
