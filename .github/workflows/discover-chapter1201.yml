name: Discover Chapter 1201 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1201.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current Chapter 1201 subset
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json
            ExcelBinOutput/QuestExcelConfigData.json
            ExcelBinOutput/ChapterExcelConfigData.json

      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify references and compile audit tools
        run: |
          python -m py_compile tools/audit_quest_prerequisite_drift.py tools/filter_quest_prerequisite_consensus.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("2000.json", "2001.json", "2002.json"):
              a = Path("ref3700/BinOutput/Quest") / name
              b = Path("ref4000/BinOutput/Quest") / name
              ah = hashlib.sha256(a.read_bytes()).hexdigest()
              bh = hashlib.sha256(b.read_bytes()).hexdigest()
              assert ah == bh, f"reference mismatch for {name}: {ah} != {bh}"
              print(f"reference-identical {name} {ah[:16]}")
          PY

      - name: Audit flattened Chapter 1201 graph
        run: |
          python tools/audit_quest_prerequisite_drift.py \
            --reference-bin-root ref3700/BinOutput/Quest \
            --reference-bin-root ref4000/BinOutput/Quest \
            --main 2000 --main 2001 --main 2002 \
            --include-reference-only \
            --only-differences \
            --json chapter1201-audit.json

          python tools/filter_quest_prerequisite_consensus.py \
            chapter1201-audit.json \
            --main 2000 --main 2001 --main 2002 \
            --consensus-count 2 \
            --json chapter1201-consensus.json

      - name: Audit current BinOutput source loss
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def meaningful(row):
              value = row.get("acceptCond")
              if not isinstance(value, list):
                  return []
              return [x for x in value if isinstance(x, dict) and x.get("type")]

          grand_total = grand_match = grand_missing = grand_other = 0
          for main_id in (2000, 2001, 2002):
              cur = json.loads((Path("BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              ref = json.loads((Path("ref3700/BinOutput/Quest") / f"{main_id}.json").read_text(encoding="utf-8"))
              cur_by_id = {int(x["subId"]): x for x in cur.get("subQuests", [])}
              ref_by_id = {int(x["subId"]): x for x in ref.get("subQuests", [])}
              print(f"main={main_id} current-subquests={len(cur_by_id)} reference-subquests={len(ref_by_id)}")
              print(f"main={main_id} current-only={sorted(set(cur_by_id)-set(ref_by_id))} ref-only={sorted(set(ref_by_id)-set(cur_by_id))}")
              match = missing = other = 0
              for sid in sorted(set(cur_by_id) & set(ref_by_id)):
                  got = meaningful(cur_by_id[sid])
                  exp = meaningful(ref_by_id[sid])
                  if got == exp:
                      match += 1
                  elif not got and exp:
                      missing += 1
                  else:
                      other += 1
                      print(f"source-other main={main_id} sub={sid} current={got!r} expected={exp!r}")
              total = len(set(cur_by_id) & set(ref_by_id))
              print(f"source-summary main={main_id} total={total} match={match} missing={missing} other={other}")
              grand_total += total
              grand_match += match
              grand_missing += missing
              grand_other += other
          print(f"source-summary-all total={grand_total} match={grand_match} missing={grand_missing} other={grand_other}")
          PY

      - name: Print complete consensus rows
        run: |
          python - <<'PY'
          import json
          report = json.load(open("chapter1201-consensus.json", encoding="utf-8"))
          for bucket in ("simple", "manual"):
              rows = report.get(bucket, [])
              print(f"{bucket}-count={len(rows)}")
              for row in rows:
                  print(
                      f"{bucket} main={row['main_id']} sub={row['sub_id']} class={row['classification']} "
                      f"current={json.dumps(row.get('current_accept', []), ensure_ascii=False, separators=(',', ':'))} "
                      f"reference={json.dumps(row.get('reference_accept', []), ensure_ascii=False, separators=(',', ':'))} "
                      f"currentComb={row.get('current_comb')} referenceComb={row.get('reference_comb')}"
                  )
          PY
