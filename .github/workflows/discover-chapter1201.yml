name: Discover Chapter 1201 prerequisite drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-chapter1201.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout GCResource 3.7 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "3700"
          path: ref3700
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json

      - name: Checkout GCResource 4.0 reference
        uses: actions/checkout@v4
        with:
          repository: TomyJan/GCResource
          ref: "4000"
          path: ref4000
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            BinOutput/Quest/2000.json
            BinOutput/Quest/2001.json
            BinOutput/Quest/2002.json

      - name: Emit complete normalized manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          STATE_TYPES = {"QUEST_COND_STATE_EQUAL", "QUEST_COND_STATE_NOT_EQUAL"}

          def normalized(row):
              out = []
              for entry in row.get("acceptCond") or []:
                  if not isinstance(entry, dict) or not entry.get("type"):
                      continue
                  params = entry.get("param") or []
                  if entry.get("type") in STATE_TYPES:
                      params = params[:2]
                  out.append({
                      "type": entry.get("type"),
                      "param": params,
                      "param_str": entry.get("param_str", entry.get("paramStr", "")) or "",
                  })
              return out

          total = 0
          for main_id in (2000, 2001, 2002):
              a = Path("ref3700/BinOutput/Quest") / f"{main_id}.json"
              b = Path("ref4000/BinOutput/Quest") / f"{main_id}.json"
              ah = hashlib.sha256(a.read_bytes()).hexdigest()
              bh = hashlib.sha256(b.read_bytes()).hexdigest()
              assert ah == bh, f"reference mismatch for {main_id}: {ah} != {bh}"
              doc = json.loads(a.read_text(encoding="utf-8"))
              rows = sorted(doc.get("subQuests", []), key=lambda x: int(x.get("subId") or 0))
              print(f"main={main_id} count={len(rows)} sha256={ah}")
              for row in rows:
                  sid = int(row["subId"])
                  comb = row.get("acceptCondComb") or "LOGIC_AND"
                  accept = json.dumps(normalized(row), ensure_ascii=False, separators=(",", ":"))
                  print(f"manifest main={main_id} sub={sid} comb={comb} accept={accept}")
                  total += 1
          assert total == 39, f"expected 39 rows, got {total}"
          print(f"manifest-total={total}")
          PY
